<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureDocs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="h3 mb-4">SecureDocs · TechCorp</h1>

  <!-- LOGIN -->
  <div id="vistaLogin" class="card p-4 mx-auto" style="max-width:400px">
    <h2 class="h5">Iniciar sesión</h2>
    <input id="correo" class="form-control mb-2" placeholder="Correo" value="carlos@techcorp.com">
    <input id="password" type="password" class="form-control mb-2" placeholder="Contraseña" value="123456">
    <button class="btn btn-primary w-100" onclick="login()">Entrar</button>
    <div id="msgLogin" class="text-danger mt-2"></div>
  </div>

  <!-- APP -->
  <div id="vistaApp" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div id="infoUsuario"></div>
      <button class="btn btn-outline-danger btn-sm" onclick="logout()">Cerrar sesión</button>
    </div>

    <div class="card p-3 mb-3">
      <h2 class="h6">Entorno de la petición (ABAC)</h2>
      <div class="row g-2">
        <div class="col-md-4">
          <select id="ubicacion" class="form-select">
            <option>PERU</option><option>CHILE</option><option>EEUU</option>
          </select>
        </div>
        <div class="col-md-4">
          <select id="dispositivo" class="form-select">
            <option>CORPORATIVO</option><option>PERSONAL</option>
          </select>
        </div>
        <div class="col-md-4">
          <input id="hora" class="form-control" placeholder="Hora simulada HH:MM (ej. 20:00)">
        </div>
      </div>
    </div>

    <div class="card p-3 mb-3">
      <h2 class="h6">Nuevo documento</h2>
      <div class="row g-2">
        <div class="col-md-5"><input id="titulo" class="form-control" placeholder="Título"></div>
        <div class="col-md-5"><input id="descripcion" class="form-control" placeholder="Descripción"></div>
        <div class="col-md-2"><input id="nivel" type="number" min="1" max="5" value="1" class="form-control"></div>
      </div>
      <button class="btn btn-success btn-sm mt-2" onclick="crearDocumento()">Crear</button>
    </div>

    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 mb-0">Documentos visibles</h2>
        <div class="d-flex gap-2">
          <input id="idManual" type="number" class="form-control form-control-sm" placeholder="ID" style="width:80px">
          <button class="btn btn-sm btn-outline-secondary" onclick="verDoc($('idManual').value)">Consultar ID</button>
          <button class="btn btn-sm btn-outline-primary" onclick="cargarDocumentos()">Actualizar</button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-sm">
          <thead><tr><th>ID</th><th>Título</th><th>Depto</th><th>Nivel</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody id="tablaDocs"></tbody>
        </table>
      </div>
    </div>

    <div id="resultado" class="alert d-none"></div>

    <div class="card p-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 mb-0">Auditoría</h2>
        <button class="btn btn-sm btn-outline-dark" onclick="cargarAuditoria()">Ver auditoría</button>
      </div>
      <div class="table-responsive">
        <table class="table table-sm small">
          <thead><tr><th>Fecha</th><th>Usuario</th><th>Recurso</th><th>Acción</th><th>Resultado</th><th>Motivo</th></tr></thead>
          <tbody id="tablaAudit"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let token = null;
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function headers() {
  const h = {
    'Content-Type': 'application/json',
    'X-Ubicacion': $('ubicacion').value,
    'X-Dispositivo': $('dispositivo').value
  };
  if (token) h['Authorization'] = 'Bearer ' + token;
  if ($('hora').value) h['X-Hora'] = $('hora').value;
  return h;
}

async function api(metodo, url, body) {
  const res = await fetch(url, { method: metodo, headers: headers(), body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

function mostrar(r, textoOk) {
  const div = $('resultado');
  div.className = 'alert ' + (r.ok ? 'alert-success' : 'alert-danger');
  div.textContent = r.ok
    ? (textoOk || 'PERMITIDO')
    : `DENEGADO (${r.status}) ${r.data.etapa || ''}: ` +
      (r.data.motivo || (r.data.motivos || []).join(' | ') || r.data.error || '');
}

async function login() {
  const r = await api('POST', '/auth/login', { correo: $('correo').value, password: $('password').value });
  if (!r.ok) {
    $('msgLogin').textContent = (r.data.motivos || []).join(' | ') || r.data.error || 'Acceso denegado';
    return;
  }
  token = r.data.token;
  const u = r.data.usuario;
  $('infoUsuario').innerHTML =
    `<strong>${esc(u.nombre)}</strong> · ${esc(u.rol)} · ${esc(u.departamento)} · nivel ${u.nivel_seguridad}`;
  $('msgLogin').textContent = '';
  $('vistaLogin').classList.add('d-none');
  $('vistaApp').classList.remove('d-none');
  cargarDocumentos();
}

async function logout() {
  await api('POST', '/auth/logout');
  token = null;
  $('vistaApp').classList.add('d-none');
  $('vistaLogin').classList.remove('d-none');
}

async function cargarDocumentos() {
  const r = await api('GET', '/documentos');
  if (!r.ok) return mostrar(r);
  $('tablaDocs').innerHTML = r.data.documentos.map(d => `
    <tr>
      <td>${d.id}</td><td>${esc(d.titulo)}</td><td>${esc(d.departamento)}</td>
      <td>${d.nivel_confidencialidad}</td><td>${esc(d.estado)}</td>
      <td>
        <button class="btn btn-sm btn-outline-secondary" onclick="verDoc(${d.id})">Ver</button>
        <button class="btn btn-sm btn-outline-success" onclick="aprobar(${d.id})">Aprobar</button>
        <button class="btn btn-sm btn-outline-danger" onclick="eliminar(${d.id})">Eliminar</button>
      </td>
    </tr>`).join('');
}

async function verDoc(id) {
  if (!id) return;
  const r = await api('GET', '/documentos/' + id);
  mostrar(r, 'PERMITIDO: ' + JSON.stringify(r.data));
}

async function aprobar(id) {
  const r = await api('POST', `/documentos/${id}/aprobar`);
  mostrar(r, 'Documento aprobado');
  cargarDocumentos();
}

async function eliminar(id) {
  const r = await api('DELETE', '/documentos/' + id);
  mostrar(r, 'Documento eliminado');
  cargarDocumentos();
}

async function crearDocumento() {
  const r = await api('POST', '/documentos', {
    titulo: $('titulo').value,
    descripcion: $('descripcion').value,
    nivel_confidencialidad: Number($('nivel').value)
  });
  mostrar(r, 'Documento creado');
  cargarDocumentos();
}

async function cargarAuditoria() {
  const r = await api('GET', '/auditoria');
  if (!r.ok) return mostrar(r);
  $('tablaAudit').innerHTML = r.data.map(a => `
    <tr class="${a.resultado === 'DENEGADO' ? 'table-danger' : ''}">
      <td>${esc(new Date(a.fecha).toLocaleString())}</td><td>${esc(a.usuario)}</td>
      <td>${esc(a.recurso)}</td><td>${esc(a.accion)}</td>
      <td>${esc(a.resultado)}</td><td>${esc(a.motivo)}</td>
    </tr>`).join('');
}
</script>
</body>
</html>
